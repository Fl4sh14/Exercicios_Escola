<!DOCTYPE html>
<html lang='pt'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Inscrição em Disciplinas</title>
<style>
  body { font-family: Arial, sans-serif; background: #f2f4f8; margin: 0; padding: 20px; }
  form { max-width: 520px; margin: auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px #0002; }
  h1 { font-size: 1.4em; margin-top: 0; }
  label { display: block; margin: 12px 0 4px; font-weight: bold; }
  input[type=text], input[type=email], input[type=date], select { width: 100%; padding: 8px; box-sizing: border-box; }
  fieldset { margin-top: 16px; border: 1px solid #ccc; }
  fieldset label { font-weight: normal; margin: 6px 0; }
  button { margin-top: 18px; padding: 10px 18px; cursor: pointer; }
  #resultado { margin-top: 16px; padding: 12px; background: #e8f5e9; display: none; }
</style>
</head>
<body>
<form id='form' action='#' method='post'>
  <h1>Inscrição em Disciplinas</h1>

  <label for='nome'>Nome</label>
  <input type='text' id='nome' name='nome' required>

  <label for='email'>Email</label>
  <input type='email' id='email' name='email' required>

  <label for='cc'>Cartão de Cidadão</label>
  <input type='text' id='cc' name='cc' placeholder='12345678 9 ZZ1' pattern='\d{8}\s?\d\s?[A-Za-z]{2}\d' title='Ex.: 12345678 9 ZZ1' required>

  <label for='nasc'>Data de nascimento</label>
  <input type='date' id='nasc' name='nasc' required>

  <label for='ano'>Ano de escolaridade</label>
  <select id='ano' name='ano' required>
    <option value=''>-- Escolha --</option>
    <option value='10'>10º Ano</option>
    <option value='11'>11º Ano</option>
    <option value='12'>12º Ano</option>
  </select>

  <label for='turma'>Turma</label>
  <select id='turma' name='turma' required disabled>
    <option value=''>-- Escolha o ano primeiro --</option>
  </select>

  <fieldset id='disciplinas' disabled>
    <legend>Disciplinas</legend>
    <p id='aviso'>Escolha o ano de escolaridade.</p>
  </fieldset>

  <button type='submit'>Inscrever</button>
  <button type='reset'>Limpar</button>

  <div id='resultado'></div>
</form>

<script>
const dados = {
  10: { turmas: ['10ºA', '10ºB'], disc: ['Português', 'Inglês', 'Matemática', 'Educação Física', 'Sistemas Operativos', 'Redes de Comunicação'] },
  11: { turmas: ['11ºA', '11ºB'], disc: ['Português', 'Inglês', 'Matemática', 'Educação Física', 'Redes de Comunicação', 'Programação'] },
  12: { turmas: ['12ºA', '12ºB'], disc: ['Português', 'Inglês', 'Matemática', 'Educação Física', 'Programação', 'Projeto'] }
};
const $ = id => document.getElementById(id);

$('ano').addEventListener('change', () => {
  const d = dados[$('ano').value];
  $('turma').innerHTML = '<option value="">-- Escolha --</option>';
  $('disciplinas').innerHTML = '<legend>Disciplinas</legend>';
  $('turma').disabled = $('disciplinas').disabled = !d;
  if (!d) { $('disciplinas').innerHTML += '<p>Escolha o ano de escolaridade.</p>'; return; }
  d.turmas.forEach(t => $('turma').innerHTML += `<option>${t}</option>`);
  d.disc.forEach(s => $('disciplinas').innerHTML += `<label><input type='checkbox' name='disciplinas' value='${s}' checked> ${s}</label>`);
});

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const f = new FormData($('form'));
  const disc = f.getAll('disciplinas');
  if (!disc.length) { alert('Escolha pelo menos uma disciplina.'); return; }
  $('resultado').style.display = 'block';
  $('resultado').innerHTML = `<b>${f.get('nome')}</b> (${f.get('email')}) inscrito na turma ${f.get('turma')} em: ${disc.join(', ')}.`;
});
</script>
</body>
</html>
